name: AI protocols and external clients
on:
  push:
    branches: [dev]
    paths:
      - 'ai-service/**'
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - 'deploy/**'
      - 'Dockerfile'
      - 'Caddyfile'
      - '.dockerignore'
      - 'compose.ai.yml'
      - '.env.ai.example'
      - '.github/workflows/ai-protocols.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/clients/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e './ai-service[test,tidb]'
      - run: python -m pytest ai-service/tests -q
      - run: chmod +x gradlew && ./gradlew test spotlessCheck bootJar --no-daemon --no-configuration-cache
        working-directory: backend
      - run: npm ci --no-audit --no-fund && npm run test:overview && npm run generate
        working-directory: frontend
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: tests/clients
      - name: Build deployable AI image
        run: docker build -t ostrm-ai-worker:ci ai-service
      - name: Validate portable Compose configuration
        run: JWT_SECRET=fixture-only-jwt-secret AI_BRIDGE_KEY=fixture-bridge-key OPENLIST_URL=http://openlist:5244 docker compose --env-file .env.ai.example -f compose.ai.yml config --quiet
      - name: Build complete OStrm AI application
        run: docker build -t ostrm-ai-app:ci .
      - name: Validate Caddy production routing
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - name: Start isolated Java and AI stack
        run: |
          mkdir -p .local/integration
          python tests/integration/run_local.py --keep > .local/integration/runner.log 2>&1 &
          for attempt in $(seq 1 360); do
            if test -f .local/integration/client.json; then exit 0; fi
            sleep 1
          done
          cat .local/integration/runner.log
          exit 1
      - run: npm run sdk
        working-directory: tests/clients
      - name: Exercise complete Docker deployment through Caddy
        run: |
          mkdir -p .local/docker-ai .local/docker-java .local/docker-exports
          docker run -d --name ai-container --network host \
            -e OPENLIST_URL=http://127.0.0.1:18789 -e OPENLIST_TOKEN=fixture-admin \
            -e MODEL_API_KEY=fixture-only -e AI_BRIDGE_KEY=fixture-bridge-key \
            -v "$PWD/.local/docker-ai:/data" -v "$PWD/.local/docker-exports:/exports" ostrm-ai-worker:ci
          docker run -d --name app-container --network host --add-host ai:127.0.0.1 \
            -e AI_SERVICE_URL=http://127.0.0.1:8787 -e AI_BRIDGE_KEY=fixture-bridge-key \
            -e JWT_SECRET=fixture-jwt-secret-at-least-32-characters-long \
            -v "$PWD/.local/docker-java:/maindata" -v "$PWD/.local/docker-exports:/app/backend/strm" ostrm-ai-app:ci
          STACK_URL=http://127.0.0.1 AI_URL=http://127.0.0.1:8787 MEDIA_TEST_URL=http://127.0.0.1 \
            CLIENT_FIXTURE=.local/docker-stack.json python tests/integration/check_stack.py
          curl --fail http://127.0.0.1/ai-center > /dev/null
      - name: Verify persisted data across actual container restarts
        run: python tests/integration/check_container_restart.py
      - name: Test Nuxt desktop and mobile
        run: |
          python tests/integration/ui_gateway.py > .local/integration/gateway.log 2>&1 &
          cd tests/clients
          npm run ui
      - name: Test same-domain subpath and OpenList administrator SSO
        run: |
          cd frontend
          NUXT_APP_BASE_URL=/ostrm/ NUXT_PUBLIC_API_BASE=/ostrm/api npm run generate
          cd ..
          TEST_APP_PREFIX=/ostrm UI_GATEWAY_PORT=18792 python tests/integration/ui_gateway.py > .local/integration/prefix-gateway.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18792/ostrm/ > /dev/null; then break; fi
            sleep 1
          done
          cd tests/clients
          TEST_APP_PREFIX=/ostrm UI_URL=http://127.0.0.1:18792/ostrm/ai-center USE_OPENLIST_SSO=1 npm run ui
      - name: Import into actual Jellyfin server
        run: |
          docker run -d --name jellyfin-test --network host -v "$PWD/.local/integration/exports:/media-ai:ro" jellyfin/jellyfin:10.11.0
          python tests/integration/check_jellyfin_server.py
      - name: Capture container diagnostics
        if: always()
        run: |
          mkdir -p .local/integration
          docker ps -a > .local/integration/docker-state.log
          for name in app-container ai-container jellyfin-test; do
            docker logs "$name" > ".local/integration/docker-$name.log" 2>&1 || true
            docker inspect "$name" --format '{{json .State}}' >> .local/integration/docker-state.log 2>/dev/null || true
          done
      - name: Retain diagnostic test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: |
            .local/integration/*.log
            .local/integration/screenshots/
            backend/build/reports/tests/
