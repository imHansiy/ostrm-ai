<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 资料与外部协议 · OStrm AI</title><link rel="stylesheet" href="/ai/assets/exports.css"><script defer src="/ai/assets/exports.js"></script></head><body>
<header><a href="/" class="brand">OStrm AI</a><nav><a href="/">返回文件</a><a href="/@manage?ai=video-tags&view=settings">模型与扫描</a><a href="/@manage?ai=video-tags&view=jobs">识别任务</a><a href="/@manage?ai=video-tags&view=library">识别资料</a></nav></header>
<main><div class="heading"><div><p class="eyebrow">CONTENT UNDERSTANDING · MEDIA PROTOCOLS</p><h1>AI 资料与外部协议</h1><p class="muted">识别视频内容，生成简介、标签、封面与入库资料。使用你的外部播放器继续观看。</p></div><button id="reload">刷新</button></div><p id="notice" role="status"></p>
<section id="statistics" class="stats" hidden></section>
<section id="workspace" hidden><form id="publication-form" class="panel"><h2>创建媒体订阅</h2><div class="fields"><label>订阅名称<input name="name" maxlength="150" value="我的视频资料库" required></label><label>公开服务地址<input name="public_base_url" type="url" required></label><label class="wide">授权目录或文件路径，每行一个<textarea name="roots" rows="3" required placeholder="/网盘/OneDrive（主账户）/Videos"></textarea></label><label>内容范围<select name="content"><option value="all">全部内容</option><option value="general">非成人</option><option value="adult">成人</option></select></label><label>最多输出条目<input name="max_items" type="number" value="5000" min="1" max="50000" required></label><label>视频播客作者（可选）<input name="author" maxlength="200"></label><label>视频播客邮箱（可选）<input name="owner_email" type="email"></label></div><label class="check"><input name="sync_enabled" type="checkbox">自动增量更新本机输出目录</label><p class="muted small">接入链接是仅限以上目录的只读凭据，可撤销或更换。模型密钥与 OpenList 管理凭据不会写入播放列表。</p><button class="primary" type="submit">创建并生成接入信息</button></form>
<section><div class="heading"><h2>媒体订阅</h2><span id="profile-count" class="muted"></span></div><div id="publications"></div></section><section class="panel"><h2>同步记录</h2><div id="jobs"></div></section></section>
<section id="login" class="panel" hidden><h2>使用 OpenList 管理员账户登录</h2><p class="muted">这个入口用于管理识别资料和外部订阅。外部播放器使用各订阅自己的凭据。</p><a class="button primary" href="/@login">前往 OpenList 登录</a></section>
</main><footer>OStrm AI · 资料与协议服务 <a href="https://github.com/imHansiy/ostrm-ai" target="_blank" rel="noopener noreferrer">项目源码</a></footer></body></html>
